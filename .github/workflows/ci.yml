name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: docker build -t ptf-dev .
      - name: Install
        run: docker run --rm -v "$PWD":/app ptf-dev npm ci
      - name: Lint
        run: docker run --rm -v "$PWD":/app ptf-dev npm run lint
      - name: Test
        run: docker run --rm -v "$PWD":/app ptf-dev npm run test:ci
      - name: Build
        run: docker run --rm -v "$PWD":/app ptf-dev npx ng build --prod
