<header class="header-area">
  <div class="main-header-area">
    <div class="classy-nav-container" [class.breakpoint-on]="isMobile" [class.breakpoint-off]="!isMobile">
      <div class="container">
        <nav class="classy-navbar justify-content-between" id="alimeNav" aria-label="Main">
          <a class="nav-brand" routerLink="/">Yuu Eguci</a>
          <button type="button"
                  class="classy-navbar-toggler"
                  aria-controls="site-menu"
                  [attr.aria-expanded]="menuOpen"
                  [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'"
                  (click)="toggleMenu()">
            <span class="navbarToggler" [class.active]="menuOpen"><span></span><span></span><span></span></span>
          </button>
          <div class="classy-menu" id="site-menu" [class.menu-on]="menuOpen">
            <div class="classynav">
              <ul id="nav">
                @for (item of navItems; track item.page) {
                  <li [class.active]="currentPage === item.page">
                    <a [routerLink]="item.path"
                       [attr.aria-current]="currentPage === item.page ? 'page' : null"
                       (click)="closeMenu()">
                      <i [class]="item.icon" aria-hidden="true"></i>
                      {{ item.label }}
                    </a>
                  </li>
                }
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </div>
</header>
