<a class="single-post-area" [routerLink]="'/' + contentUrl">
  <span class="post-thumbnail"><img [src]="thumbnailUrl" alt="" width="800" height="530"></span>
  <span class="post-content">
    <h2 class="post-title">{{ contentTitle }}</h2>
    <span class="post-meta">{{ contentDescription }}</span>
  </span>
</a>
