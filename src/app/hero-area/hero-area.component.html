<section class="hero-area">
  <div class="welcome-slides">
    <div class="single-welcome-slide bg-img bg-overlay"
         [ngStyle]="{ 'background-image': 'url(' + backgroundImagePath + ')'}">
      <div class="container h-100">
        <div class="row h-100 align-items-center">
          <div class="col-12 col-lg-8 col-xl-6">
            <div class="welcome-text">
              <h1>
                I'm<br>Flexible
              </h1>
              <p>
                I'm Yuu Eguci, a full stack web developer from Japan.
                I make things with joy and enjoy creating them together with my team.
                This portfolio shows examples of that work.
              </p>
              <div class="hero-btn-group">
                <a class="hero-mail-contact" href="mailto:yuu.eguci@gmail.com">
                  <i class="fas fa-envelope" aria-hidden="true"></i>
                  yuu.eguci@gmail.com
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
