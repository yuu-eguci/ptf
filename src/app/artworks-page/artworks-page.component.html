<app-header-area currentPage="artworks"></app-header-area>

<app-breadcrumb currentPageTitle="Artworks" backgroundImagePath="/assets/img/bg-img/page-header-2.jpg"></app-breadcrumb>

<div class="mt-30">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="section-heading text-center">
          <h2>Things</h2>
        </div>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        <div class="blog-details-text">
          <p>
            I draw with a ballpoint pen.
            Although I have practiced watercolor painting, I'm not so particular about coloring.
            I also design mug coasters, stamps and more.
          </p>
          <p>
            Take a look anyway!
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="alime-portfolio-area section-padding-80 clearfix">
  <div class="container-fluid">
    <div class="gallery-grid">
      <div *ngFor="let _ of galleryItemLength; let index = index;"
           class="gallery-grid-item">
        <app-gallery-item [imgAlt]="'Artwork ' + (index + 1)" imgUrl="/assets/img/art-img/{{index}}.jpg"></app-gallery-item>
      </div>
    </div>
  </div>
</div>

<app-author-area></app-author-area>
