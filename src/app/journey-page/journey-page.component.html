<app-header-area currentPage="journey"></app-header-area>

<app-breadcrumb currentPageTitle="Homeless journey" backgroundImagePath="/assets/img/bg-img/page-header-3.jpg"></app-breadcrumb>

<div class="mt-30">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="section-heading text-center">
          <h2>A 1-year journey at 18, a 1-month journey at 28</h2>
        </div>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        <div class="blog-details-text">
          <p>
            A life of sleeping outdoors.
            It's okay to be caught in the rain and exposed to the sun.
            All creatures on the earth live that way.
            Take a look anyway!
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="alime-portfolio-area section-padding-80 clearfix">
  <div class="container-fluid">
    <div class="gallery-grid">
      @for (_ of galleryItemLength; track $index) {
        <div class="gallery-grid-item">
          <app-gallery-item [imgAlt]="'Journey photo ' + ($index + 1)" imgUrl="/assets/img/journey-img/{{$index}}.jpg"></app-gallery-item>
        </div>
      }
    </div>
  </div>
</div>
